[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "davinci-flow"
version = "0.1.0"
description = "Automatización modular de subtítulos y edición para DaVinci Resolve."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
authors = [{ name = "biglexj" }]
dependencies = []

[project.scripts]
davinci-flow = "davinci_flow.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
