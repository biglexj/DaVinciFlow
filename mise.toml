# Configuración de tareas de DaVinci Flow mediante Mise
# Reutiliza el estándar común: dev, build, release, publish

[tasks.dev]
raw_args = true
description = "Ejecutar DaVinci Flow en desarrollo (Python / Flet Desktop)"
file = "scripts/mise-task.ts"

[tasks.build]
raw_args = true
description = "Compilar paquetes de Python y verificar sintaxis sin generar instalador"
file = "scripts/mise-task.ts"

[tasks.release]
raw_args = true
description = "Generar instalador oficial Inno Setup en release/ sin publicar"
file = "scripts/mise-task.ts"

[tasks.publish]
raw_args = true
description = "Publicar release en GitHub y sincronizar ficha en Aurora (--plan y --check sin escritura)"
file = "scripts/mise-task.ts"
