[package]
name = "davinci-flow-gpui"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "Demo nativa incremental de DaVinci Flow"

[dependencies]
gpui-kit = "=0.9.1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"
unicode-general-category = "1"
walkdir = "2"

[profile.dev]
debug = 0
incremental = true

[profile.test]
debug = 0
